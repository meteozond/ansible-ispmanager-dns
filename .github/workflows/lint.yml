name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ansible-lint flake8 yamllint

      - name: Run flake8
        run: |
          flake8 plugins/ --max-line-length=120 --ignore=E501

      - name: Run yamllint
        run: |
          yamllint roles/ -d relaxed

      - name: Run ansible-lint
        run: |
          ansible-lint roles/
